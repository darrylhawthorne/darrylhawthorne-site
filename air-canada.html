<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Canada Assistant, a case study by Darryl Hawthorne</title>
<meta name="description" content="An airline chatbot that admits when it is not sure.">
<link rel="canonical" href="https://darrylhawthorne.com/air-canada">
<meta property="og:title" content="Air Canada Assistant, a case study by Darryl Hawthorne">
<meta property="og:description" content="An airline chatbot that admits when it is not sure.">
<meta property="og:url" content="https://darrylhawthorne.com/air-canada">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E0E10">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#F6F6F6}
a{color:#111113}a:hover{color:#A61E26}
.dh{font-family:Inter,system-ui,sans-serif;color:#111113;-webkit-font-smoothing:antialiased}
.disp{font-family:'Bricolage Grotesque',Inter,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px;box-sizing:border-box}
.narrow{max-width:760px}
.navlink{text-decoration:none;font-size:15px;font-weight:500;padding:12px 4px;position:relative}
.navlink::after{content:'';position:absolute;left:4px;right:4px;bottom:6px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.1,1)}
.navlink:hover::after,.navlink:focus-visible::after{transform:scaleX(1)}
a:focus-visible,button:focus-visible{outline:3px solid #111113;outline-offset:3px}
.eyebrow{margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#A61E26}
.h2{margin:0;font-size:clamp(30px,3.6vw,46px);letter-spacing:-0.03em;line-height:1.05;font-weight:650}
.body{font-size:19px;line-height:1.6;color:#3D3E43;margin:20px 0 0}
.sec{padding-top:128px}
.prog{position:fixed;top:0;left:0;right:0;height:4px;background:#A61E26;transform-origin:left;transform:scaleX(0);z-index:5}
.fade{animation:fadeup .9s cubic-bezier(.2,.75,.1,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-fan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,40px);align-items:start;padding:48px 0 24px}
.hero-fan img,.scr img,.iter img{filter:drop-shadow(0 0 .6px rgba(17,17,19,.45))}
.hero-fan img{display:block;width:100%;height:auto}
.f1{margin-top:64px;animation:rise1 1.1s .3s cubic-bezier(.2,.75,.1,1) both}
.f2{animation:rise1 1.1s .15s cubic-bezier(.2,.75,.1,1) both}
.f3{margin-top:64px;animation:rise1 1.1s .45s cubic-bezier(.2,.75,.1,1) both}
@keyframes rise1{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.fail{padding-top:20px;border-top:1px solid #111113}
.fail h3{margin:0;font-size:18px}
.fail p{margin:8px 0 0;font-size:16px;line-height:1.55;color:#3D3E43}
.hax{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:#CFCFCA;border:1px solid #CFCFCA}
.tile{min-height:92px;border:0;background:#F6F6F6;color:#111113;font:600 15px Inter,sans-serif;text-align:left;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s,color .2s}
.tile:hover{background:#FFFFFF}
.tile.pri{background:#A61E26;color:#FFFFFF}
.tile.pri:hover{background:#8E1820}
.tile.na{color:#6B6C70;background:repeating-linear-gradient(135deg,#F6F6F6 0 8px,#EDEDEA 8px 9px)}
.tile.sel{box-shadow:inset 0 0 0 3px #111113}
.tile.pri.sel{box-shadow:inset 0 0 0 3px #111113,inset 0 0 0 5px #FFFFFF}
.tile small{font:500 12px Inter,sans-serif;opacity:.9}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{padding-top:20px;border-top:2px solid #A61E26;position:relative}
.flow li b{display:block;font-size:17px}
.flow li span{display:block;margin-top:6px;font-size:15px;line-height:1.5;color:#3D3E43}
.flow .num{font:700 13px Inter,sans-serif;letter-spacing:.08em;color:#A61E26;margin:0 0 10px}
.scr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 32px}
.scr figure{margin:0}
.scr img{display:block;width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.75,.1,1)}
.scr figure:hover img{transform:translateY(-8px)}
.scr figcaption{margin-top:16px;font-size:15px;line-height:1.45;color:#3D3E43}
.scr figcaption b{display:block;color:#111113;font-size:16px;margin-bottom:4px}
.hx{display:block;margin-top:8px;font:700 12px Inter,sans-serif;letter-spacing:.08em;color:#A61E26}
.next{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;text-decoration:none;color:#F6F6F6;padding:72px 0}
.next:hover{color:#F6F6F6}.next:hover .arrow{transform:translateX(10px)}
.arrow{display:inline-block;transition:transform .35s}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
@keyframes reveal{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.prog{animation:prog linear both;animation-timeline:scroll(root)}
@keyframes prog{to{transform:scaleX(1)}}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1000px){.scr{grid-template-columns:repeat(2,minmax(0,1fr))}.hax{grid-template-columns:repeat(3,minmax(0,1fr))}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.hero-fan{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.f1,.f3{margin-top:28px}.detail{grid-template-columns:1fr!important}}
@media (max-width:640px){.wrap{padding:0 20px}.hax{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><noscript><p style="font-family: sans-serif; padding: 40px">This site needs JavaScript turned on. You can reach Darryl at <a href="mailto:darrylh1301@gmail.com">darrylh1301@gmail.com</a>.</p></noscript></div>
<script type="module" src="/js/air-canada.js"></script>
</body>
</html>
